        <div style="position:absolute;background:#c2874f;height:1px;left:496.32px;border-radius:1px;top:337px;width:401.28px" ></div>
</div>
<div id="covers"></div>
</div></div>
<div id="extra" class="extra"></div>
<p class="hint" id="message" role="status">Try opening The Last Orchard.</p>
</main>
<dialog id="add-dialog" aria-labelledby="add-heading">
<form id="add-book">
<h2 id="add-heading">Add a book</h2>
<label>Title<input name="title" required maxlength="120" autofocus></label>
<label>Author (optional)<input name="author" maxlength="100"></label>
<label>Shelf<select name="status"></select></label>
<p id="error" class="error" role="alert"></p>
<menu><button type="button" data-close>Cancel</button><button type="submit" class="primary">Add book</button></menu>
</form>
</dialog>
<dialog id="details" aria-labelledby="book-title">
<h2 id="book-title"></h2><p id="book-author"></p>
<label>Move to shelf<select id="move"></select></label>
<button type="button" data-close>Done</button>
</dialog>
<script>
const shelves = new Map([['want','Want to Read'],['reading','Currently Reading'],['finished','Finished']]);
const examples = [
 ['The Last Orchard','Mina Reyes','finished',335,10,78,99,0,'#654085','#f4d4ac'],
 ['Moonlight Letters','Noor Idris','reading',415,28,63,80,5,'#254e68','#d3ecf3'],
 ['A Place for Rain','Ella Brooks','finished',524,16,71,90,-4,'#ac5049','#ffe9ca'],
 ['The Quiet Library','Leah Chen','want',296,133,67,84,-4,'#375d50','#dcecc0'],
 ['Saltwater Summer','Maya Reed','reading',480,126,74,94,0,'#d79456','#372a34'],
 ['The House of Fig Trees','Hana Ali','finished',565,139,63,80,5,'#84567d','#ffe7c7']
];
const key = 'personal-bookshelf-v1';
const byId = id => document.getElementById(id);
const add = byId('add-dialog');
const form = byId('add-book');
const details = byId('details');
const move = byId('move');
const message = byId('message');
const search = byId('search');
const cabinet = byId('cabinet');
const viewport = byId('cabinet-scroll');
const filters = byId('filters');
const extra = byId('extra');
const defaults = examples.map(([title,author,status],i) => ({id:'figma-'+i,title,author,status}));
let books = defaults;
let filter = 'all';
let activeId;
let feedback = 'Try opening The Last Orchard.';
try {
  const stored = JSON.parse(localStorage.getItem(key));
  if (Array.isArray(stored)) books = stored.filter(book => book && typeof book.id === 'string' &&
    typeof book.title === 'string' && typeof book.author === 'string' && shelves.has(book.status));
  if (books.some(book => book.id.startsWith('sample-')) && !books.some(book => book.id.startsWith('figma-'))) {
    books = [...defaults, ...books];
  }
} catch { feedback = 'Saved books could not be loaded.'; }
function save(nextBooks, text) {
  books = nextBooks;
  feedback = text;
  try { localStorage.setItem(key, JSON.stringify(books)); }
  catch { feedback += ' Browser storage is unavailable.'; }
}
function openBook(book) {
  activeId = book.id;
  byId('book-title').textContent = book.title;
  byId('book-author').textContent = book.author || 'Author unspecified';
  move.value = book.status;
  details.showModal();
}
function render() {
  filters.replaceChildren();
  for (const [value,label] of [['all','All books'], ...shelves]) {
    const button = document.createElement('button');
    button.textContent = label + ' · ' + books.filter(b => value === 'all' || b.status === value).length;
    button.setAttribute('aria-pressed', String(value === filter));
    button.dataset.filter = value;
    button.onclick = () => { filter = value; render(); filters.querySelector('[aria-pressed=true]').focus(); };
    filters.append(button);
  }
  const rating = document.createElement('button');
  rating.className = 'rating';
  rating.textContent = 'Any rating ▾';
  rating.onclick = () => { message.textContent = 'Rating filters are planned for a later version.'; };
  filters.append(rating);
  const covers = byId('covers');
  covers.replaceChildren();
  extra.replaceChildren();
  const query = search.value.trim().toLowerCase();
  const visible = books.filter(b => (filter === 'all' || filter === b.status) &&
    (b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query)));
  let addedIndex = 0;
  visible.forEach(book => {
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.book = book.id;
    button.setAttribute('aria-label','Open '+book.title);
    button.onclick = () => openBook(book);
    const original = defaults.findIndex(item => item.id === book.id);
    const addedSlot = original < 0 ? addedIndex++ : -1;
    if (addedSlot >= 2 || window.innerWidth <= 740) {
      button.textContent = book.title;
      extra.append(button);
      if (addedSlot >= 2) return;
    }
    const cover = button.cloneNode();
    cover.onclick = () => openBook(book);
    const [,,,x,y,w,h,angle,bg,ink] = examples[original] || ['', '', '', 315 + addedSlot * 425, 245, 64, 86, 0, '#32594c', '#fff3d5'];
    cover.className = 'cover';
    Object.assign(cover.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',
      transform:'rotate('+angle+'deg)',background:bg,color:ink});
    const title = document.createElement('span');
    title.textContent = book.title;
    const art = document.createElement('img');
    art.src = 'assets/imgCoverIllustration'+(original || '')+'.svg';
    art.alt = '';
    const author = document.createElement('small');
    author.textContent = book.author;
    cover.append(title);
    if (original >= 0) cover.append(art);
    cover.append(author);
    covers.append(cover);
  });
  message.textContent = visible.length ? feedback : 'No books match this view.';
}
function fitShelf() {
  const scale = Math.min(1, Math.max(660,viewport.clientWidth)/1056);
  cabinet.style.zoom = scale;
}
for (const [value,label] of shelves) {
  form.elements.status.add(new Option(label,value));
  move.add(new Option(label,value));
}
byId('open-add').onclick = () => { byId('error').textContent = ''; add.showModal(); };
document.querySelectorAll('[data-close]').forEach(button => { button.onclick = () => button.closest('dialog').close(); });
document.querySelectorAll('[data-planned]').forEach(button => {
  button.onclick = () => { message.textContent = button.dataset.planned+' is planned for a later version.'; };
});
form.addEventListener('submit',event => {
  event.preventDefault();
  const title = form.elements.title.value.trim();
  if (!title) {
    byId('error').textContent = 'Enter a book title.';
    form.elements.title.focus();
    return;
  }
  const status = form.elements.status.value;
  save([...books,{id:crypto.randomUUID(),title,author:form.elements.author.value.trim(),status}],
    title+' added to '+shelves.get(status)+'.');
  filter = 'all';
  search.value = '';
  form.reset();
  add.close();
  render();
});
move.addEventListener('change',() => {
  const book = books.find(item => item.id === activeId);
  if (!book) return;
  save(books.map(item => item.id === activeId ? {...item,status:move.value} : item),
    book.title+' moved to '+shelves.get(move.value)+'.');
  filter = 'all';
  render();
});
details.addEventListener('close',() => {
  document.querySelectorAll('[data-book]').forEach(button => {
    if (button.dataset.book === activeId && document.activeElement === document.body) button.focus();
  });
});
search.addEventListener('input',render);
new ResizeObserver(fitShelf).observe(viewport);
window.matchMedia('(max-width: 740px)').addEventListener('change',render);
render();
</script>
</body>
</html>
